<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar actions</title>
<style>
:root{--bg:#f3f4f7;--panel:#fff;--tx:#121826;--mut:#667085;--ln:#dde1e8;--up:#0f7b57;--dn:#c23b32;--ac:#33498a}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--panel:#171b24;--tx:#e6e9f0;--mut:#8b94a7;--ln:#272d3a;--up:#4cc79b;--dn:#ff7a70;--ac:#8fa6f0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:20px;max-width:980px;margin-inline:auto}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:16px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.mut{color:var(--mut)}.up{color:var(--up)}.dn{color:var(--dn)}
.num{font-variant-numeric:tabular-nums}
details{background:var(--panel);border:1px solid var(--ln);border-radius:6px;margin-bottom:8px}
summary{display:grid;grid-template-columns:1.6fr 1fr 70px 1.2fr 120px;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--ac)}
summary b{display:block}
.score{display:flex;align-items:center;gap:8px}
.meter{flex:1;height:6px;background:var(--ln);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ac);width:var(--w)}
.sp{width:100%;height:32px;color:var(--ac)}
.body{padding:4px 14px 16px;border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
h2{font-size:14px;margin:14px 0 6px}
table{width:100%;border-collapse:collapse}
td,th{padding:4px 0;text-align:left;border-bottom:1px solid var(--ln);font-weight:400}
th{color:var(--mut);font-size:13px}td:last-child,th:last-child{text-align:right}
.wrap{overflow-x:auto}
.flag{display:inline-block;background:var(--ac);color:var(--bg);border-radius:4px;padding:1px 7px;font-size:12px;margin:2px 4px 2px 0}
.news a{color:inherit;text-decoration:none}.news a:hover{text-decoration:underline}
.news li{margin-bottom:6px}ul{padding-left:18px;margin:0}
footer{margin-top:18px;font-size:13px}
@media(max-width:640px){summary{grid-template-columns:1fr 1fr}.sp,.score{grid-column:1/-1}}
</style></head><body>
<header><h1>Radar actions</h1><span class="mut" id="upd">Chargement…</span></header>
<main id="app"></main>
<footer class="mut">Données Yahoo Finance, décalées de 15 min environ. Le score est un indicateur automatique (valorisation, croissance, rentabilité, bilan, tendance, consensus), pas un conseil en investissement.</footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=(x,d=2)=>x==null?'–':Number(x).toLocaleString('fr-FR',{maximumFractionDigits:d});
const p=(x,d=1)=>x==null?'–':(x*100).toLocaleString('fr-FR',{maximumFractionDigits:d})+' %';
const big=x=>x==null?'–':x>=1e9?f(x/1e9,1)+' Md':f(x/1e6,0)+' M';
const spark=a=>{const mn=Math.min(...a),mx=Math.max(...a);return `<svg class="sp" viewBox="0 0 300 32" preserveAspectRatio="none"><polyline fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" points="${a.map((y,i)=>(i/(a.length-1)*300).toFixed(1)+','+(30-(y-mn)/(mx-mn||1)*28).toFixed(1)).join(' ')}"/></svg>`};
const label=s=>s==null?'n.d.':s>=65?'Solide':s>=45?'Mitigé':'Fragile';
function row(t){
  const m=t.metrics,up=(t.change||0)>=0;
  const rows=[['Capitalisation',big(m.marketCap)],['PER',f(m.trailingPE,1)+' (secteur : '+f(t.median_peer_pe,1)+')'],['PER prévisionnel',f(m.forwardPE,1)],['Cours / valeur comptable',f(m.priceToBook,1)],
   ['Croissance du CA',p(m.revenueGrowth)],['Marge nette',p(m.profitMargins)],['Marge opérationnelle',p(m.operatingMargins)],['ROE',p(m.returnOnEquity)],['Dette / fonds propres',m.debtToEquity==null?'–':f(m.debtToEquity,0)+' %'],
   ['Free cash-flow',big(m.freeCashflow)],['Bêta',f(m.beta)],['Objectif moyen analystes',f(m.targetMeanPrice)+' ('+esc(t.recommendation||'n.d.')+')'],
   ['Plus haut / bas 52 sem.',f(t.high52)+' / '+f(t.low52)],['RSI 14j',f(t.rsi,0)],['MM50 / MM200',f(t.ma50)+' / '+f(t.ma200)],['Prochains résultats',esc((t.earnings||'n.d.').slice(0,10))]];
  return `<details><summary>
   <span><b>${esc(t.name)}</b><span class="mut">${esc(t.symbol)}${t.sector?' · '+esc(t.sector):''}</span></span>
   <span class="num"><b>${f(t.price)} ${esc(t.currency||'')}</b><span class="${up?'up':'dn'}">${up?'+':''}${p(t.change,2)}</span></span>
   <span class="num" title="Score sur 100"><b>${t.score??'–'}</b><span class="mut">${label(t.score)}</span></span>
   <span class="score"><span class="meter"><i style="--w:${t.score||0}%"></i></span></span>
   ${spark(t.spark)}</summary>
   <div class="body">
    <section>${t.flags.length?'<h2>Alertes du jour</h2>'+t.flags.map(x=>`<span class="flag">${esc(x)}</span>`).join(''):''}
     <h2>Chiffres clés</h2><table>${rows.map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td></tr>`).join('')}</table></section>
    <section><h2>Détail du score</h2><table>${Object.entries(t.components).map(([k,v])=>`<tr><td>${k}</td><td class="num">${v}/100</td></tr>`).join('')}</table>
     <h2>Concurrents</h2><div class="wrap"><table><tr><th>Société</th><th>PER</th><th>Croiss.</th><th>Marge</th><th>6 mois</th></tr>
     ${t.peers.map(q=>`<tr><td>${esc(q.name)}</td><td class="num">${f(q.pe,1)}</td><td class="num">${p(q.growth)}</td><td class="num">${p(q.margin)}</td><td class="num">${p(q.perf6m)}</td></tr>`).join('')}</table></div>
     <h2>Actualité</h2><ul class="news">${t.news.map(n=>`<li><a href="${esc(n.url)}" target="_blank" rel="noopener">${n.sentiment>0?'🟢':n.sentiment<0?'🔴':'⚪'} ${esc(n.title)}</a> <span class="mut">${esc(n.source||'')} ${esc(n.date)}</span></li>`).join('')||'<li class="mut">Aucune actualité récente.</li>'}</ul></section>
   </div></details>`}
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('upd').textContent='Mis à jour le '+new Date(d.updated).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
  document.getElementById('app').innerHTML=d.tickers.map(row).join('')||'<p class="mut">Aucune donnée.</p>';
}).catch(()=>{document.getElementById('upd').textContent='Pas encore de données : lance le workflow "Analyse" sur GitHub.'});
</script></body></html>
