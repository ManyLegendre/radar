# Les actions à surveiller. Symboles Yahoo Finance : Paris = .PA, Allemagne = .DE, USA = rien.
# "peers" = concurrents comparés (valorisation, marges, croissance).
watchlist:
  - symbol: MC.PA
    peers: [RMS.PA, KER.PA, OR.PA]
  - symbol: TTE.PA
    peers: [SHEL.L, XOM, BP.L]
  - symbol: HO.PA
    peers: [AIR.PA, SAF.PA, RHM.DE]
  - symbol: NVDA
    peers: [AMD, AVGO, TSM]
  - symbol: ASML.AS
    peers: [AMAT, LRCX, KLAC]
  - symbol: TSM
    peers: [INTC, 005930.KS, GFS]
  - symbol: AIR.PA
    peers: [BA, SAF.PA, ERJ]
  - symbol: SU.PA
    peers: [SIE.DE, ABBN.SW, LR.PA]
  - symbol: ENGI.PA
    peers: [IBE.MC, ENEL.MI, EOAN.DE]
  - symbol: RUI.PA
    peers: [VOPA.AS, SUN, TTE.PA]
  - symbol: DG.PA
    peers: [HO.PA, ACS.MC, ENA.MI]
  - symbol: VIE.PA
    peers: [SEV.PA, ENG.MC, EVT.PA]
  - symbol: BNP.PA
    peers: [GLE.PA, ACA.PA, SAN.MC]
  - symbol: CA.PA
    peers: [TGT, AHO.AS, WMT]
  - symbol: ACA.PA
    peers: [BNP.PA, GLE.PA, ISP.MI]
  - symbol: GLE.PA
    peers: [BNP.PA, ACA.PA, DBK.DE]
  - symbol: CS.PA
    peers: [ALV.DE, ZURN.SW, G.MI]
  - symbol: HNA.DE
    peers: [RHM.DE, HO.PA, LDO.MI]
  - symbol: ENE.PA
    peers: [TTE.PA, SUN, VOPA.AS]
  - symbol: AMZN
    peers: [WMT, BABA, MSFT]
  - symbol: GOOGL
    peers: [MSFT, META, AMZN]

# Seuils qui déclenchent une notification
thresholds:
  move_pct: 3          # variation du jour en %
  volume_ratio: 2      # volume du jour / moyenne 20 jours
  rsi_high: 70         # surachat
  rsi_low: 30          # survente
  earnings_days: 3     # prévenir X jours avant les résultats
